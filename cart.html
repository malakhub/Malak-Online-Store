<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malak | Cart</title>
    <link rel="icon" href="./img/icon.png">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/pages.css">
    <script src="https://kit.fontawesome.com/3da8b86f0c.js" crossorigin="anonymous"></script>
</head>
<body class="inner" data-page="cart">
<div id="site-header"></div>
<script src="./JS/common.js"></script>
<main class="container page">
<h1 class="page-title">Your cart</h1>
<div class="cart-layout">
  <div id="cart-items"></div>
  <aside class="summary">
    <h3>Order summary</h3>
    <div class="row"><span>Items</span><b id="sum-items">0</b></div>
    <div class="row"><span>Total</span><b id="cart-total">$0.00</b></div>
    <a href="checkout.html" class="btn" id="to-checkout">Continue to checkout</a>
  </aside>
</div>
</main>
<script src="./JS/cart.js"></script>
</body>
</html>
