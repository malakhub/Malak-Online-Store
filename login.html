<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malak | Login</title>
    <link rel="icon" href="./img/icon.png">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/pages.css">
    <script src="https://kit.fontawesome.com/3da8b86f0c.js" crossorigin="anonymous"></script>
</head>
<body class="inner" data-page="login">
<div id="site-header"></div>
<script src="./JS/common.js"></script>
<main class="container page">
<div class="auth">
  <h1>Welcome back</h1>
  <p class="hint">Log in to check out faster.</p>
  <form class="stack" id="login_form" novalidate>
    <input id="login_email" type="email" placeholder="Email">
    <div class="err" id="login_email_err"></div>
    <input id="login_password" type="password" placeholder="Password">
    <div class="err" id="login_password_err"></div>
    <button class="btn" type="submit">Login</button>
  </form>
  <p class="switch">New here? <a href="signup.html">Create an account</a></p>
</div>
</main>
<script src="./JS/auth.js"></script>
<script src="./JS/login.js"></script>
</body>
</html>
